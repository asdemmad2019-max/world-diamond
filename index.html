<script>
const SUPABASE_URL="https://cwwvuwqmiaoyctfhjxez.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_JmbeY1li_JTtZ8P7fvik8Q_9IzihPCR";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const app=document.getElementById('app'), nav=document.getElementById('nav');
let USER=null, IS_ADMIN=false, TAB='feed', BLOCKED=new Set(), VIDEO_OWNERS={}, PROFILE_ID=null, REPLY_TO=null, SAVED=new Set(), NOTIF_UNREAD=0, COUNTS={pub:0,mine:0,pend:0}, SEARCH='', LIKES={}, COMMENTS={}, FOLLOWS={}, MY_FOLLOWING=new Set(), USER_SEARCH='', SORT='new', MY_FOLLOWERS=0, PROFILES={}, VIEWS=[], VIEWS_COUNT={}, VIEWS_RANGE='all';

function displayNameOf(uid, email){
  const pr = PROFILES[uid];
  if(pr && (pr.display_name || pr.username)) return pr.display_name || ('@'+pr.username);
  if(uid===USER?.id && localStorage.getItem('wd_name')) return localStorage.getItem('wd_name');
  return (email||'').split('@')[0] || 'مستخدم';
}
function avatarOf(uid,size){
  const pr=PROFILES[uid];
  if(pr && pr.avatar_url) return '<img class="'+(size==='mini'?'avatar-mini':'avatar')+'" src="'+esc(pr.avatar_url)+'">';
  const nm=displayNameOf(uid,''); const L=(nm[0]||'D').toUpperCase();
  if(size==='mini') return '<span class="avatar-mini-letter">'+L+'</span>';
  return L;
}
function usernameOf(uid){
  const pr = PROFILES[uid];
  if(pr && pr.username) return '@'+pr.username;
  return '';
}
async function loadProfiles(){
  try{ const {data} = await sb.from('profiles').select('*'); (data||[]).forEach(r=>{ PROFILES[r.user_id]=r; }); }catch(e){}
}
async function loadViews(){
  try{ const {data} = await sb.from('views').select('video_id,viewer_id,created_at'); VIEWS=data||[]; VIEWS_COUNT={}; VIEWS.forEach(r=>{ VIEWS_COUNT[r.video_id]=(VIEWS_COUNT[r.video_id]||0)+1; }); }catch(e){ VIEWS=[]; VIEWS_COUNT={}; }
}
function viewsInRange(range){
  const now = new Date();
  let from = null;
  if(range==='hour') from = new Date(now.getTime()-3600*1000);
  if(range==='day') from = new Date(now.getTime()-24*3600*1000);
  if(range==='week') from = new Date(now.getTime()-7*24*3600*1000);
  if(range==='month') from = new Date(now.getTime()-30*24*3600*1000);
  if(range==='year') from = new Date(now.getTime()-365*24*3600*1000);
  return VIEWS.filter(r=>{ if(!from) return true; return new Date(r.created_at) >= from; });
}
function myViewsInRange(range){
  // مشاهدات فيديوهاتي فقط - نحتاج قائمة فيديوهاتي
  const mineIds = new Set((MY_VIDEO_IDS||[]));
  return viewsInRange(range).filter(r=>mineIds.has(r.video_id));
}

function viewLabel(v){ const views=VIEWS_COUNT[v.id]||0; const d=likeInfo(v.id).count||0; const pct=views>0?Math.round(d/views*100):0; return '👁️ '+views+' • <img class="diamond-btn-img" src="diamond-small.png?v=27" style="width:14px;height:14px"> '+d+' • '+pct+'%'; }
function myTotals(){ const mine=(MY_VIDEO_IDS||[]); let views=0,d=0; mine.forEach(id=>{ views+=(VIEWS_COUNT[id]||0); d+=(likeInfo(id).count||0); }); return {views,d,pct:views>0?Math.round(d/views*100):0}; }

async function trackView(videoId){
  try{
    const key = 'wd_viewed_'+videoId+'_'+new Date().toISOString().slice(0,10);
    if(localStorage.getItem(key)) return;
    localStorage.setItem(key,'1');
    const {error} = await sb.from('views').insert([{video_id:videoId, viewer_id:USER.id}]);
    if(!error){ VIEWS_COUNT[videoId]=(VIEWS_COUNT[videoId]||0)+1; const el=document.getElementById('vc-'+videoId); if(el) el.innerHTML='👁️ '+(VIEWS_COUNT[videoId]||0)+' • <img class="diamond-btn-img" src="diamond-small.png?v=27" style="width:14px;height:14px"> '+(likeInfo(videoId).count||0)+' • '+((VIEWS_COUNT[videoId]||0)>0?Math.round((likeInfo(videoId).count||0)/(VIEWS_COUNT[videoId]||1)*100):0)+'%'; }
  }catch(e){}
}

function spawnDiamonds(n=12){ const fx=document.getElementById('fx'); if(!fx) return; for(let i=0;i<n;i++){ const s=document.createElement('img'); s.src='diamond-small.png?v=27'; s.className='fall-img'; s.style.left=Math.random()*100+'%'; const sz=18+Math.random()*22; s.style.width=sz+'px'; s.style.height=sz+'px'; s.style.animationDuration=(2.5+Math.random()*2)+'s'; fx.appendChild(s); setTimeout(()=>s.remove(),4500); } }
function toast(m){ if(!m.includes('خطأ')) spawnDiamonds(10);const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function setErr(m){const e=document.getElementById('err'); if(e) e.textContent=m}
function showLogin(msg=''){ hideFab(); nav.style.display='none'; app.innerHTML=`<div class="card"><input id="em" type="email" placeholder="إيميلك"><input id="pw" type="password" placeholder="كلمة السر"><input id="suName" placeholder="اسمك... مثلا عماد"><input id="suUser" placeholder="اليوزر... مثلا emmad"><button id="loginBtn" onclick="doLogin()">دخول</button><button class="ghost" onclick="doSignup()">إنشاء حساب جديد</button><button class="ghost" onclick="resend()">رسالة تأكيد</button><div class="err" id="err">${esc(msg)}</div></div>`; }
async function doSignup(){ const btn=document.getElementById('loginBtn'); try{ const email=v('em'),pw=v('pw'); if(!email) return setErr('اكتب إيميلك أولاً'); if(pw.length<6) return setErr('كلمة السر لازم 6 أحرف وفوق'); if(btn) btn.textContent='جاري إنشاء الحساب...'; const {data,error}=await sb.auth.signUp({email,password:pw}); if(error) throw error; try{ const nm=(document.getElementById('suName')?.value||'').trim(); const un=(document.getElementById('suUser')?.value||'').trim().replace('@','').toLowerCase(); if(data.user && (nm||un)) await sb.from('profiles').upsert([{user_id:data.user.id, display_name:nm||null, username:un||null}], {onConflict:'user_id'}); }catch(e){} toast('تم ✅ افتح إيميلك وأكد الحساب'); showLogin('تم ✅ روح لإيميلك وأكد الحساب، بعدها اضغط دخول'); }catch(e){ setErr(friendly(e)); } if(btn) btn.textContent='دخول'; }
function friendly(e){ const m=String(e&&e.message||e||''); if(m.includes('Email not confirmed')) return 'إيميلك بعد ما تأكد - افتح إيميلك واضغط رابط التأكيد، أو اضغط زر (رسالة تأكيد)'; if(m.includes('Invalid login')) return 'الإيميل أو كلمة السر غلط - تأكد منهن وحاول مرة ثانية'; if(m.includes('User already')) return 'هذا الإيميل مسجل أصلاً - اضغط دخول بدل إنشاء حساب'; if(m.includes('Failed to fetch')||m.includes('Network')) return 'النت ضعيف - شغل النت وحاول مرة ثانية'; if(m.includes('supabase')) return 'مشكلة اتصال بالسيرفر - حدث الصفحة وحاول'; return 'خطأ: '+m; }
async function doLogin(){ const btn=document.getElementById('loginBtn'); try{ if(!window.supabase||!sb) return setErr('الصفحة ما حملت كاملة - حدث الصفحة وحاول'); const email=v('em'),pw=v('pw'); if(!email) return setErr('اكتب إيميلك'); if(!pw) return setErr('اكتب كلمة السر'); if(btn){ btn.disabled=true; btn.textContent='جاري الدخول...'; } setErr('جاري الدخول...'); const {data,error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; if(!data||!data.user) throw new Error('ما رجع حساب - حاول مرة ثانية'); setErr('تم الدخول ✅'); await afterLogin(); }catch(e){ setErr(friendly(e)); } if(btn){ btn.disabled=false; btn.textContent='دخول'; } }
async function resend(){ try{ const email=v('em'); if(!email) return setErr('اكتب إيميلك أولاً'); setErr('جاري إرسال رسالة التأكيد...'); const {error}=await sb.auth.resend({type:'signup',email}); if(error) throw error; setErr('تم 📩 افتح إيميلك واضغط رابط التأكيد'); toast('تم 📩'); }catch(e){ setErr(friendly(e)); } }
async function afterLogin(){ try{ const {data:{user}}=await sb.auth.getUser(); USER=user; if(!user) return showLogin('ما لگينا حساب - سجل دخول مرة ثانية'); try{ const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle(); IS_ADMIN=!!data; }catch(e){ IS_ADMIN=false; } try{ await loadCounts(); }catch(e){ COUNTS={pub:0,mine:0,pend:0}; } try{ await loadProfiles(); await loadViews(); await loadBlocks(); await loadSaved(); await loadNotifs(); }catch(e){} render(); }catch(e){ setErr(friendly(e)); } }
async function loadCounts(){ try{ const {data:pub}=await sb.from('videos').select('id').eq('is_published',true); const {data:mine}=await sb.from('videos').select('id').eq('owner_id',USER.id); MY_VIDEO_IDS=(mine||[]).map(x=>x.id); const {data:pend}=await sb.from('videos').select('id').eq('is_published',false); COUNTS={pub:pub?.length||0,mine:mine?.length||0,pend:pend?.length||0}; }catch(e){ COUNTS={pub:0,mine:0,pend:0}; } }

function openProfile(uid){ if(!uid) return; if(uid===USER.id){ TAB='you'; render(false); return; } PROFILE_ID=uid; TAB='profile'; render(false); }
async function loadSaved(){ try{ const {data}=await sb.from('saved_videos').select('video_id').eq('user_id',USER.id); SAVED=new Set((data||[]).map(r=>r.video_id)); }catch(e){ SAVED=new Set(); } }
async function toggleSave(vid,btn){ try{ if(SAVED.has(vid)){ const {error}=await sb.from('saved_videos').delete().eq('user_id',USER.id).eq('video_id',vid); if(error) throw error; SAVED.delete(vid); toast('تمت الإزالة من المحفوظ'); } else { const {error}=await sb.from('saved_videos').insert([{user_id:USER.id, video_id:vid}]); if(error) throw error; SAVED.add(vid); toast('تم الحفظ 🔖'); } if(btn){ btn.classList.toggle('on',SAVED.has(vid)); btn.textContent=SAVED.has(vid)?'محفوظ 🔖':'حفظ 🔖'; } }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 07 بالـ SQL'); } }
async function notifyUser(to, type, vid, cid){ try{ if(!to||to===USER.id) return; await sb.from('notifications').insert([{user_id:to, actor_id:USER.id, type, video_id:vid||null, comment_id:cid||null}]); }catch(e){} }
async function loadNotifs(){ try{ const {data}=await sb.from('notifications').select('*').eq('user_id',USER.id).eq('is_read',false); NOTIF_UNREAD=(data||[]).length; const b=document.getElementById('notifBadge'); if(b) b.innerHTML=NOTIF_UNREAD?'<span class="notif-dot">'+NOTIF_UNREAD+'</span>':''; }catch(e){} }
async function renderNotifs(){ const box=document.getElementById('notifList'); if(!box) return; try{ const {data}=await sb.from('notifications').select('*').eq('user_id',USER.id).order('created_at',{ascending:false}).limit(50); if(!data||!data.length){ box.innerHTML='<p class="small">ما عندك تنبيهات بعد</p>'; return; } box.innerHTML=data.map(n=>{ const label=n.type==='follow'?'تابعك':n.type==='comment'?'علق بفيديوك':n.type==='like'?'سوى جوهرة لفيديوك':n.type; return `<div class="comment ${n.is_read?'':'notif-unread'}" onclick="openNotif('${n.id}','${n.type}','${n.actor_id||''}','${n.video_id||''}')"><b>${avatarOf(n.actor_id,'mini')} ${esc(displayNameOf(n.actor_id,''))}</b> ${label}<br><small>${new Date(n.created_at).toLocaleDateString('ar')}</small></div>`; }).join(''); await sb.from('notifications').update({is_read:true}).eq('user_id',USER.id).eq('is_read',false); NOTIF_UNREAD=0; const b=document.getElementById('notifBadge'); if(b) b.innerHTML=''; }catch(e){ box.innerHTML='<p class="err">'+esc(e.message)+' - نفذ ملف 07 بالـ SQL</p>'; } }
async function openNotif(id,type,actor,vid){ if(type==='follow'){ openProfile(actor); } else { TAB='feed'; render(false); toast('افتح الفيديو من الرئيسية'); } }

async function renderReports(){ const box=document.getElementById('reportsList'); if(!box) return; try{ const {data}=await sb.from('reports').select('*').eq('status','open').order('created_at',{ascending:false}); if(!data||!data.length){ box.innerHTML='<p class="small">ما عندك تبليغات جديدة</p>'; return; } box.innerHTML=data.map(r=>`<div class="comment"><b>تبليغ ${r.target_type==='video'?'على فيديو':'على تعليق'}</b> من ${esc(displayNameOf(r.reporter_id,''))}<br><small>السبب: ${esc(r.reason||'')}</small><br><small>${new Date(r.created_at).toLocaleDateString('ar')}</small><div class="row" style="margin-top:6px">${r.target_type==='video'?`<button class="del" style="padding:8px" onclick="adminHandleReport(${r.id},'video',${r.target_id})">حذف الفيديو</button>`:`<button class="del" style="padding:8px" onclick="adminHandleReport(${r.id},'comment',${r.target_id},${r.target_owner_id||0})">حذف التعليق</button>`}<button class="ghost" style="padding:8px" onclick="adminHandleReport(${r.id},'dismiss',0)">تجاهل</button></div></div>`).join(''); }catch(e){ box.innerHTML='<p class="err">'+esc(e.message)+' - نفذ ملف 07 بالـ SQL</p>'; } }
async function adminHandleReport(rid, action, targetId, vid){ try{ if(action==='video') await sb.from('videos').delete().eq('id',targetId); if(action==='comment') await sb.from('comments').delete().eq('id',targetId); await sb.from('reports').update({status: action==='dismiss'?'dismissed':'handled'}).eq('id',rid); toast('تم ✅'); renderReports(); }catch(e){ toast('خطأ: '+e.message); } }
async function renderUsers(){ const box=document.getElementById('usersList'); if(!box) return; try{ const {data}=await sb.from('videos').select('owner_id,owner_email'); const map={}; (data||[]).forEach(v=>{ if(!v.owner_id) return; if(!map[v.owner_id]) map[v.owner_id]={email:v.owner_email||'',count:0}; map[v.owner_id].count++; }); let users=Object.entries(map).map(([id,u])=>({id,...u})); const q=(USER_SEARCH||'').trim().toLowerCase(); if(q) users=users.filter(u=>((u.email||'').toLowerCase().includes(q) || (displayNameOf(u.id,u.email).toLowerCase().includes(q)) || (usernameOf(u.id).toLowerCase().includes(q)))); await loadFollows([]); if(!users.length){ box.innerHTML='<p class="small">ما لگينا يوزر بهذا الاسم</p>'; return; } box.innerHTML=users.map(u=>`<div class="comment" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b><span class="clickable" onclick="openProfile('${u.id}')">${avatarOf(u.id,'mini')} ${esc(displayNameOf(u.id, u.email))}</span></b><br><small>${esc(usernameOf(u.id))}</small><br><small>${u.count} فيديو • ${FOLLOWS[u.id]||0} متابع</small></div>${u.id===USER.id?'':`<button class="ghost follow-btn ${MY_FOLLOWING.has(u.id)?'on':''}" style="width:auto;padding:10px 14px" onclick="toggleFollow('${u.id}',this)">${MY_FOLLOWING.has(u.id)?'DIAMOND':'تابع'}</button>`}</div>`).join(''); }catch(e){ box.innerHTML='<p class="err">'+esc(e.message)+'</p>'; } }
async function loadFollows(list){ try{ const {data}=await sb.from('follows').select('follower_id,following_id'); const all=data||[]; MY_FOLLOWING=new Set(all.filter(r=>r.follower_id===USER.id).map(r=>r.following_id)); FOLLOWS={}; all.forEach(r=>{ FOLLOWS[r.following_id]=(FOLLOWS[r.following_id]||0)+1; }); const mf=document.getElementById('myFollowers'); if(mf) mf.textContent=all.filter(r=>r.following_id===USER.id).length; const mg=document.getElementById('myFollowing'); if(mg) mg.textContent=MY_FOLLOWING.size; const md=document.getElementById('myDiamonds'); if(md){ const {data:lk}=list.length?await sb.from('likes').select('video_id').in('video_id',list.map(x=>x.id)):{data:[]}; md.textContent=(lk||[]).length; } }catch(e){} }
async function toggleFollow(ownerId,btn){ if(!ownerId||ownerId===USER.id) return; try{ if(MY_FOLLOWING.has(ownerId)){ const {error}=await sb.from('follows').delete().eq('follower_id',USER.id).eq('following_id',ownerId); if(error) throw error; MY_FOLLOWING.delete(ownerId); toast('تم إلغاء المتابعة'); } else { const {error}=await sb.from('follows').insert([{follower_id:USER.id,following_id:ownerId}]); if(error) throw error; MY_FOLLOWING.add(ownerId); toast('تابعت'); await notifyUser(ownerId,'follow',null,null); if(btn) btn.classList.add('burst'); } await loadFollows([]); await loadNotifs(); render(); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 03 بالـ SQL'); } }
function maskEmail(e){ if(!e) return ''; const [a,b]=e.split('@'); return a.slice(0,2)+'***@'+(b||''); }
async function saveName(){
  const n=document.getElementById('displayName').value.trim();
  const u=(document.getElementById('usernameInput')?.value||'').trim().replace('@','').replace(/\s+/g,'').toLowerCase();
  if(!n && !u) return toast('اكتب اسمك أو اليوزر');
  if(u && !/^[a-z0-9_\.]{3,30}$/.test(u)) return toast('اليوزر: حروف انكليزية وأرقام فقط، 3 أحرف وفوق، بدون مسافات');
  try{
    const {error} = await sb.from('profiles').upsert([{user_id:USER.id, display_name:n||null, username:u||null}], {onConflict:'user_id'});
    if(error) throw error;
    if(n) localStorage.setItem('wd_name',n);
    PROFILES[USER.id]={user_id:USER.id, display_name:n||null, username:u||null};
    const m=document.getElementById('nameMsg'); if(m) m.textContent='تم ✅ اسمك هسه: '+(n||'')+' '+(u?('@'+u):'');
    toast('تم حفظ اسمك واليوزر');
    render();
  }catch(e){ toast('خطأ: '+(e.message.includes('duplicate')||e.message.includes('unique') ? 'هذا اليوزر مأخوذ - اختار يوزر ثاني' : e.message+' - نفذ ملف 04 بالـ SQL')); }
}
async function changeAvatar(input){
  const file=input.files && input.files[0]; if(!file) return;
  const msg=document.getElementById('avatarMsg')||document.getElementById('avatarMsg2');
  if(msg) msg.textContent='جاري تجهيز الصورة...';
  try{
    const dataUrl=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const img=new Image(); img.src=dataUrl; await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; });
    const S=300; const c=document.createElement('canvas'); const scale=Math.min(1,S/Math.max(img.width,img.height)); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const small=c.toDataURL('image/jpeg',0.85);
    const {error}=await sb.from('profiles').upsert([{user_id:USER.id, avatar_url:small}], {onConflict:'user_id'});
    if(error) throw error;
    PROFILES[USER.id]=Object.assign({}, PROFILES[USER.id]||{}, {avatar_url:small});
    if(msg) msg.textContent='تم ✅ تغيرت صورتك';
    toast('تم ✅ تغيرت صورتك');
    render();
  }catch(e){ if(msg) msg.textContent=''; toast('خطأ: '+(e.message||'').includes('avatar_url') ? 'نفذ ملف 05-add-avatar بالـ SQL بعدها جرب مرة ثانية' : e.message); }
  input.value='';
}

async function loadLikes(list){ LIKES={}; try{ const ids=list.map(x=>x.id); if(!ids.length) return; const {data}=await sb.from('likes').select('video_id,user_id').in('video_id',ids); (data||[]).forEach(r=>{ LIKES[r.video_id]=LIKES[r.video_id]||{count:0,mine:false}; LIKES[r.video_id].count++; if(r.user_id===USER.id) LIKES[r.video_id].mine=true; }); }catch(e){} }
function rankFor(n){ const IG='<img class="diamond-inline" src="diamond-small.png?v=27">'; if(n>=50) return [IG,'rank-diamond']; if(n>=20) return [IG+' ذهبي','rank-gold']; if(n>=5) return [IG+' فضية','']; return [IG+' جديدة','']; }
async function doubleDiamond(id,el){ const d=document.createElement('div'); d.className='big-diamond'; const im=document.createElement('img'); im.src='diamond.png?v=27'; im.className='big-diamond-img'; d.appendChild(im); el.appendChild(d); setTimeout(()=>d.remove(),800); const info=likeInfo(id); if(!info.mine) await toggleLike(id,null); spawnDiamonds(14); }
function reactComment(btn){ const box=btn.closest('.comment'); if(!box) return; let s=box.querySelector('.reacts'); if(!s){ s=document.createElement('div'); s.className='reacts small'; box.appendChild(s); } const im=document.createElement('img'); im.src='diamond-small.png?v=27'; im.className='diamond-react'; im.style.marginLeft='4px'; s.appendChild(im); spawnDiamonds(3); }
function likeInfo(id){ return LIKES[id]||{count:0,mine:false}; }
async function toggleLike(id,btn){ try{ const info=likeInfo(id); if(info.mine){ const {error}=await sb.from('likes').delete().eq('video_id',id).eq('user_id',USER.id); if(error) throw error; LIKES[id]={count:Math.max(0,info.count-1),mine:false}; } else { const {error}=await sb.from('likes').insert([{video_id:id,user_id:USER.id}]); if(error) throw error; LIKES[id]={count:info.count+1,mine:true}; toast('جوهرة ذهبية!'); await notifyUser(VIDEO_OWNERS[id],'like',id,null); } const b=btn||document.getElementById('like-'+id); if(b){ b.classList.toggle('on',LIKES[id].mine); b.innerHTML='<img class="diamond-btn-img" src="diamond-small.png?v=27" style="width:22px;height:22px;filter:drop-shadow(0 0 6px #FFD700)"> '+LIKES[id].count; if(LIKES[id].mine){ b.classList.add('burst'); setTimeout(()=>b.classList.remove('burst'),800); } } }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 03 بالـ SQL'); } }
async function loadBlocks(){ try{ const {data}=await sb.from('blocks').select('blocked_id').eq('blocker_id',USER.id); BLOCKED=new Set((data||[]).map(r=>r.blocked_id)); }catch(e){ BLOCKED=new Set(); } }
async function renderBlockedList(){ const box=document.getElementById('blockedList'); if(!box) return; if(!BLOCKED.size){ box.innerHTML='<p class="small">ما حاظر أحد - الكل يگدر يعلق</p>'; return; } box.innerHTML=[...BLOCKED].map(uid=>`<div class="comment" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div>${avatarOf(uid,'mini')} <b>${esc(displayNameOf(uid,''))}</b><br><small>محظور من التعليق بفيديوهاتك</small></div><button class="ghost" style="width:auto;padding:10px 14px" onclick="unblockUser('${uid}')">سماح ✅</button></div>`).join(''); }
async function unblockUser(uid){ try{ const {error}=await sb.from('blocks').delete().eq('blocker_id',USER.id).eq('blocked_id',uid); if(error) throw error; BLOCKED.delete(uid); toast('تم السماح له - يگدر يعلق هسه'); renderBlockedList(); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 06-blocks بالـ SQL'); } }
async function toggleBlockUser(uid,videoId){ try{ if(BLOCKED.has(uid)){ await unblockUser(uid); } else { const {error}=await sb.from('blocks').insert([{blocker_id:USER.id, blocked_id:uid}]); if(error) throw error; BLOCKED.add(uid); toast('تم حظره - بعد ما يگدر يعلق بفيديوهاتك'); } if(videoId) await loadComments(videoId); renderBlockedList(); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 06-blocks بالـ SQL'); } }
async function deleteComment(cid,videoId){ if(!confirm('تحذف هذا التعليق؟')) return; try{ const {error}=await sb.from('comments').delete().eq('id',cid); if(error) throw error; toast('تم حذف التعليق'); await loadComments(videoId); }catch(e){ toast('خطأ: '+e.message); } }
async function loadComments(id){ try{ const {data}=await sb.from('comments').select('*').eq('video_id',id).order('created_at',{ascending:true}); let all=data||[]; COMMENTS[id]=all; const tops=all.filter(c=>!c.parent_id).sort((a,b)=>((b.is_pinned?1:0)-(a.is_pinned?1:0))||(new Date(a.created_at)-new Date(b.created_at))); const box=document.getElementById('cm-'+id); if(!box) return; if(!all.length){ box.innerHTML='<p class="small">لا يوجد تعليقات بعد - كن أول واحد</p>'; return; } const isOwner=VIDEO_OWNERS[id]===USER.id; box.innerHTML=tops.map(c=>commentHtml(c,id,isOwner,all)).join(''); }catch(e){} }
function commentHtml(c,id,isOwner,all){ const canManage=isOwner||IS_ADMIN||c.user_id===USER.id; const canBlock=(isOwner||IS_ADMIN)&&c.user_id!==USER.id; const reps=(all||[]).filter(r=>r.parent_id===c.id); const inner=`<div class="comment ${c.parent_id?'reply':''}"><b><span class="clickable" onclick="openProfile('${c.user_id}')">${avatarOf(c.user_id,'mini')} ${esc(displayNameOf(c.user_id, c.user_email))}</span></b>${c.is_pinned?' <span class="pill">📌 مثبت</span>':''}${BLOCKED.has(c.user_id)?' <span class="pill">محظور</span>':''}<br>${esc(c.text)}<div class="emoji-row"><button onclick="reactComment(this)"><img class="diamond-react" src="diamond-small.png?v=27" alt=""></button><button onclick="setReply(${id},${c.id},'${esc(displayNameOf(c.user_id,''))}')">↩ رد</button></div><div class="row" style="margin-top:6px">${c.user_id===USER.id?`<button class="ghost" style="padding:8px" onclick="editComment(${c.id},${id},'${esc(c.text)}')">تعديل</button>`:''}${isOwner||IS_ADMIN?`<button class="ghost" style="padding:8px" onclick="togglePin(${c.id},${id},${c.is_pinned?'false':'true'})">${c.is_pinned?'إلغاء تثبيت':'📌 تثبيت'}</button>`:''}${canBlock?`<button class="ghost" style="padding:8px" onclick="toggleBlockUser('${c.user_id}',${id})">${BLOCKED.has(c.user_id)?'سماح ✅':'حظر 🚫'}</button>`:''}${canManage?`<button class="del" style="padding:8px" onclick="deleteComment(${c.id},${id})">حذف</button>`:''}<button class="ghost" style="padding:8px" onclick="reportItem('comment',${c.id},'${c.user_id}')">🚨 تبليغ</button></div></div>`; return inner + reps.map(r=>commentHtml(r,id,isOwner,all)).join(''); }
function setReply(vid,cid,name){ REPLY_TO={vid,cid}; const inp=document.getElementById('ci-'+vid); if(inp){ inp.placeholder='رد على '+name+'...'; inp.focus(); } toast('رد على '+name); }

async function sendComment(id){ const inp=document.getElementById('ci-'+id); const text=inp.value.trim(); if(!text) return toast('اكتب تعليق أولاً'); try{ const owner=VIDEO_OWNERS[id]; if(owner && owner!==USER.id){ const {data}=await sb.from('blocks').select('id').eq('blocker_id',owner).eq('blocked_id',USER.id).maybeSingle(); if(data) return toast('صاحب الفيديو حظرك من التعليق'); } }catch(e){} const btn=document.getElementById('cb-'+id); if(btn) btn.disabled=true; try{ const parentId=(REPLY_TO&&REPLY_TO.vid===id)?REPLY_TO.cid:null; const {data:ins,error}=await sb.from('comments').insert([{video_id:id,user_id:USER.id,user_email:USER.email,text,parent_id:parentId}]).select('id').maybeSingle(); if(error) throw error; inp.value=''; inp.placeholder='✨ اكتب تعليق جميل...'; REPLY_TO=null; toast('تم إرسال تعليقك'); await notifyUser(VIDEO_OWNERS[id],'comment',id,ins&&ins.id); await loadComments(id); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 03 بالـ SQL'); } if(btn) btn.disabled=false; }

function tile(v){ return `<div class="tile"><video src="${esc(v.video_url)}" preload="metadata" poster="${esc(v.image_url||'')}"></video><div class="p"><b>${esc(v.title)}</b><br><small><span class="clickable" onclick="openProfile('${v.owner_id}')">${esc(displayNameOf(v.owner_id, v.owner_email))}</span> • 👁️ ${VIEWS_COUNT[v.id]||0} • <img class="diamond-btn-img" src="diamond-small.png?v=27" style="width:14px;height:14px"> ${likeInfo(v.id).count||0} • ${(VIEWS_COUNT[v.id]||0)>0?Math.round((likeInfo(v.id).count||0)/(VIEWS_COUNT[v.id]||1)*100):0}% • ${v.is_published?'✅ منشور':'⏳ بانتظار'}</small></div></div>`; }
function card(v){ const isMine=v.owner_id===USER.id; const lk=likeInfo(v.id); return `<div class="video" id="video-${v.id}" ondblclick="doubleDiamond(${v.id},this)"><div class="vwrap"><video src="${esc(v.video_url)}" controls preload="metadata" poster="${esc(v.image_url||'')}" onplay="trackView(${v.id})" style="${videoStyle()}"></video><button class="vdots" onclick="toggleDots(${v.id},event)">⋮</button><div class="vmenu" id="vm-${v.id}"><b>حجم الفيديو</b><button class="ghost" onclick="setVideoSize(${v.id},'auto')">تلقائي</button><button class="ghost" onclick="setVideoSize(${v.id},'fill')">ملء الشاشة</button><button class="ghost" onclick="setVideoSize(${v.id},'fit')">عادي</button><b>الدقة</b><button class="ghost" onclick="setVideoQuality(${v.id},'auto')">تلقائي</button><button class="ghost" onclick="setVideoQuality(${v.id},'high')">عالية</button><button class="ghost" onclick="setVideoQuality(${v.id},'saver')">توفير بيانات</button></div></div><div class="pad"><b>${esc(v.title)}</b><br><small><span class="clickable" onclick="openProfile('${v.owner_id}')">${esc(displayNameOf(v.owner_id, v.owner_email))}</span> ${esc(usernameOf(v.owner_id))} • ${new Date(v.created_at).toLocaleDateString('ar')} • <span id="vc-${v.id}">👁️ ${VIEWS_COUNT[v.id]||0} • <img class="diamond-btn-img" src="diamond-small.png?v=27" style="width:14px;height:14px"> ${likeInfo(v.id).count||0} • ${(VIEWS_COUNT[v.id]||0)>0?Math.round((likeInfo(v.id).count||0)/(VIEWS_COUNT[v.id]||1)*100):0}%</span></small><br><span class="badge">${v.is_published?'✅ منشور':'⏳'}</span> ${v.visibility==='followers'?'<span class="badge">👥 خاص</span>':''} <span class="badge ${rankFor(lk.count)[1]}">${rankFor(lk.count)[0]}</span><p style="font-size:13px;color:#ccc">${esc(v.description||'')}</p>
<div class="vstack"><button class="ghost follow-btn ${MY_FOLLOWING.has(v.owner_id)?'on':''}" onclick="toggleFollow('${v.owner_id}',this)" ${v.owner_id===USER.id?'style="display:none"':''}>${MY_FOLLOWING.has(v.owner_id)?'DIAMOND':'تابع'}</button><button class="ghost like diamond-btn ${lk.mine?'on':''}" id="like-${v.id}" onclick="toggleLike(${v.id},this)"><img class="diamond-btn-img" src="diamond-small.png?v=27" alt="💎" style="width:22px;height:22px;filter:drop-shadow(0 0 6px #FFD700)"> ${lk.count}</button><button class="ghost" onclick="loadComments(${v.id})">💬 تعليقات</button><button class="ghost" onclick="shareVideo(${v.id},'${esc(v.video_url)}')">↗ مشاركة</button><button class="ghost ${SAVED.has(v.id)?'on':''}" onclick="toggleSave(${v.id},this)">${SAVED.has(v.id)?'محفوظ 🔖':'حفظ 🔖'}</button><button class="ghost" onclick="reportItem('video',${v.id},'${v.owner_id}')">🚨 تبليغ</button></div>
<div id="cm-${v.id}"></div><div class="row comment-row" style="margin-top:8px"><input id="ci-${v.id}" placeholder="✨ اكتب تعليق جميل..."><button id="cb-${v.id}" onclick="sendComment(${v.id})">إرسال</button></div>
<div class="row" style="margin-top:8px">${IS_ADMIN&&!v.is_published?`<button class="approve" onclick="approve(${v.id})">✅ موافقة</button>`:''}${IS_ADMIN&&v.is_published?`<button class="ghost" onclick="unpublish(${v.id})">إخفاء</button>`:''}${(IS_ADMIN||isMine)?`<button class="del" onclick="delVideo(${v.id})">🗑 حذف</button>`:''}</div></div></div>`; }
async function approve(id){const {error}=await sb.from('videos').update({is_published:true}).eq('id',id); if(error) return toast(error.message); toast('تم ✅'); await loadCounts(); render()}
async function unpublish(id){const {error}=await sb.from('videos').update({is_published:false}).eq('id',id); if(error) return toast(error.message); toast('تم ✅'); await loadCounts(); render()}
async function delVideo(id){if(!confirm('حذف؟'))return; const {error}=await sb.from('videos').delete().eq('id',id); if(error) return toast(error.message); toast('تم ✅'); await loadCounts(); render()}
async function doUpload(){ const btn=document.getElementById('upBtn'), err=document.getElementById('upErr'); const title=document.getElementById('title').value.trim(), desc=document.getElementById('desc').value.trim(); const file=document.getElementById('file').files[0], cover=document.getElementById('cover').files[0]; if(!title||!file){err.textContent='';return} btn.disabled=true; btn.textContent='جاري الرفع...'; const pr=document.getElementById('upProg'); if(pr) pr.style.width='30%'; const st=document.getElementById('upStat'); if(st) st.textContent='جاري رفع الفيديو... لا تسكر الصفحة'; try{ const fname=USER.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'); const {error:upErr}=await sb.storage.from('videos').upload(fname,file,{upsert:true}); if(upErr) throw upErr; const {data:pub}=sb.storage.from('videos').getPublicUrl(fname); let image_url=''; if(cover){ const cf=USER.id+'/'+Date.now()+'-cover-'+cover.name.replace(/[^a-zA-Z0-9._-]/g,'_'); const {error:cerr}=await sb.storage.from('covers').upload(cf,cover,{upsert:true}); if(!cerr) image_url=sb.storage.from('covers').getPublicUrl(cf).data.publicUrl; } const vis=(document.getElementById('vis')?.value||'public'); let insErr=null; try{ const r=await sb.from('videos').insert([{title,description:desc,video_url:pub.publicUrl,image_url,owner_id:USER.id,owner_email:USER.email,is_published:IS_ADMIN,visibility:vis}]); insErr=r.error; if(insErr && String(insErr.message||'').includes('visibility')){ const r2=await sb.from('videos').insert([{title,description:desc,video_url:pub.publicUrl,image_url,owner_id:USER.id,owner_email:USER.email,is_published:IS_ADMIN}]); insErr=r2.error; } }catch(e){ insErr=e; } if(insErr) throw insErr; toast('تم ✅'); TAB='you'; await loadCounts(); render(); }catch(e){ const m=String(e.message||''); err.textContent = m.includes('row-level')||m.includes('violates') ? 'الصلاحية مسدودة بالسوبربيس - نفذ ملف 03-fix-rls بالـ SQL بعدها ارفع مرة ثانية' : m; btn.disabled=false; btn.textContent='🚀 ارفع'; } }
if(window.supabase) sb.auth.getSession().then(({data})=>{ if(data.session) afterLogin(); });
if('caches' in window){ caches.keys().then(ks=>Promise.all(ks.filter(k=>k!=='world-diamond-v27').map(k=>caches.delete(k)))); }
if(!sessionStorage.getItem('wd_v27_cleared')){ sessionStorage.setItem('wd_v27_cleared','1'); if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>location.reload()); } }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js?v=27').catch(()=>{}); }

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
