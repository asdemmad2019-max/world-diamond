<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;padding-bottom:90px}
.top{position:sticky;top:0;z-index:10;background:#000;text-align:center;padding:14px 10px 4px}
@keyframes dspin{0%,100%{transform:rotateY(-22deg) rotateX(6deg)}50%{transform:rotateY(22deg) rotateX(-4deg)}}
@keyframes dfloat{0%,100%{margin-top:0}50%{margin-top:-6px}}
.diamond-img{width:96px;height:96px;object-fit:cover;border-radius:22px;display:block;margin:0 auto;animation:dspin 6s ease-in-out infinite,dfloat 3s ease-in-out infinite;box-shadow:0 0 28px rgba(255,215,0,.55)}
.diamond-mini-img{width:28px;height:28px;object-fit:cover;border-radius:8px;display:inline-block;vertical-align:middle;box-shadow:0 0 10px rgba(255,215,0,.5)}

.diamond-react{width:20px;height:20px;object-fit:cover;border-radius:6px;vertical-align:middle}
.fall-img{width:28px;height:28px;object-fit:cover;border-radius:8px;position:absolute;top:-30px;animation:fall linear forwards;opacity:.95}

.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:linear-gradient(180deg,#131008,#0a0a0a);border:1px solid rgba(212,175,55,.45);border-radius:22px;padding:18px;margin-bottom:12px}
input,textarea{width:100%;background:#111;border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:14px;color:#fff;margin-bottom:10px;font-size:15px}
button{width:100%;background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000;border:none;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;margin-bottom:8px;font-size:15px}
button:disabled{opacity:.5}.ghost{background:#111!important;color:#D4AF37!important;border:1px solid rgba(212,175,55,.35)}
.small{font-size:12px;color:rgba(212,175,55,.85);text-align:center}.err{color:#ff8080;font-size:13px;text-align:center;min-height:18px}
.profile{text-align:center}.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;margin:0 auto;border:3px solid #FFD700;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar-mini{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #FFD700;vertical-align:middle}.avatar-mini-letter{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;vertical-align:middle}
.stats{display:flex;gap:8px;margin-top:14px}.stat{flex:1;background:#111;border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:10px 4px;text-align:center}.stat b{color:#FFD700;font-size:18px;display:block}.stat span{font-size:11px;color:#D4AF37}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#111;border:1px solid rgba(212,175,55,.25);border-radius:16px;overflow:hidden}.tile video{width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;display:block}.tile .p{padding:9px}.tile b{font-size:13px}.tile small{color:#D4AF37;font-size:11px}
.video{background:#111;border:1px solid rgba(212,175,55,.25);border-radius:18px;overflow:hidden;margin-bottom:14px}.video video{width:100%;display:block;background:#000;max-height:520px}.pad{padding:13px}.pad b{font-size:16px}.pad small{color:#D4AF37}
.badge{display:inline-block;font-size:11px;background:#222;border:1px solid rgba(212,175,55,.4);color:#FFD700;border-radius:999px;padding:4px 10px;margin-top:7px}
.row{display:flex;gap:8px}.row button{flex:1}.del{background:#221111!important;color:#ff8080!important;border:1px solid rgba(255,0,0,.3)}.approve{background:#0f2212!important;color:#7dff9a!important;border:1px solid rgba(0,255,0,.3)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid rgba(212,175,55,.35);display:flex;z-index:20;overflow-x:auto}
.nav button{flex:1;min-width:62px;background:none!important;color:#D4AF37;border:none;border-radius:0;padding:10px 2px;font-size:12px;margin:0}
.nav button.on{background:rgba(212,175,55,.15)!important;color:#FFD700}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #D4AF37;padding:10px 18px;border-radius:999px;font-size:13px;display:none;z-index:99}
.section{color:#FFD700;font-size:17px;font-weight:900;margin:8px 0 10px}
.like.on{background:linear-gradient(135deg,#D4AF37,#FFD700)!important;color:#000!important;box-shadow:0 0 18px rgba(255,215,0,.9);transform:scale(1.05)}
.diamond-btn{transition:.2s}
.diamond-btn:active{transform:scale(.9)}
.burst{position:relative}
.burst::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;background:url('diamond-small.png?v=20') center/cover no-repeat;border-radius:12px;transform:translate(-50%,-50%);animation:burst .8s ease forwards;pointer-events:none;box-shadow:0 0 18px rgba(255,215,0,.8)}

.comment{animation:fadeIn .3s ease}

.follow-btn.on{background:linear-gradient(135deg,#D4AF37,#FFD700)!important;color:#000!important}
.security-card{background:#0a0a0a;border:1px solid rgba(255,215,0,.3);border-radius:14px;padding:12px;margin-bottom:10px}
.pill{display:inline-block;background:#1a1605;border:1px solid rgba(255,215,0,.4);color:#FFD700;border-radius:999px;padding:4px 10px;font-size:12px;margin:2px}
.comment{background:#0a0a0a;border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px}
.comment b{color:#FFD700;font-size:12px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fall{position:absolute;top:-30px;animation:fall linear forwards;opacity:.9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.video{position:relative}
.big-diamond{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;pointer-events:none;animation:pop .8s ease forwards;z-index:3;text-shadow:0 0 30px #FFD700}
@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.1);opacity:1}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1.2);opacity:0}}
.chip{flex:1;background:#111!important;color:#D4AF37!important;border:1px solid rgba(212,175,55,.35);border-radius:999px;padding:10px 4px!important;font-size:12px}
.chip.on{background:linear-gradient(135deg,#D4AF37,#FFD700)!important;color:#000!important}
.rank-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000!important}
.rank-diamond{background:linear-gradient(135deg,#fff,#00E5FF);color:#000!important}
.skeleton{height:280px;background:linear-gradient(90deg,#111 25%,#222 50%,#111 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:18px;margin-bottom:14px}
@keyframes shimmer{to{background-position:-200% 0}}
.progress{height:8px;background:#222;border-radius:999px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#D4AF37,#FFD700);width:0%;transition:.3s}
.emoji-row{display:flex;gap:6px;margin-top:6px}
.emoji-row button{padding:8px!important;font-size:16px;background:#111!important}
.leader{border:1px solid rgba(255,215,0,.5);background:linear-gradient(180deg,#1a1400,#0a0a0a)}
.topbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.reply{margin-right:18px;border-right:2px solid rgba(212,175,55,.5)}.notif-dot{background:#ff3b30;color:#fff;font-size:10px;border-radius:999px;padding:1px 6px;margin-right:4px;display:inline-block}.notif-unread{border-color:#FFD700!important;background:#1a1400!important}.clickable{cursor:pointer}.clickable:hover{color:#FFD700}

</style>
</head>

<script>
(function(){ try{
  if(localStorage.getItem('wd_ver')==='V20') return;
  localStorage.setItem('wd_ver','V20');
  if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }
  if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
  // reload once with fresh version so new SW takes over
  setTimeout(function(){ location.replace(location.pathname+'?v=20&fresh='+Date.now()); }, 300);
}catch(e){} })();
</script>

<script>
const SUPABASE_URL="https://cwwvuwqmiaoyctfhjxez.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_JmbeY1li_JTtZ8P7fvik8Q_9IzihPCR";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const app=document.getElementById('app'), nav=document.getElementById('nav');
let USER=null, IS_ADMIN=false, TAB='feed', BLOCKED=new Set(), VIDEO_OWNERS={}, PROFILE_ID=null, REPLY_TO=null, SAVED=new Set(), NOTIF_UNREAD=0, COUNTS={pub:0,mine:0,pend:0}, SEARCH='', LIKES={}, COMMENTS={}, FOLLOWS={}, MY_FOLLOWING=new Set(), USER_SEARCH='', SORT='new', MY_FOLLOWERS=0, PROFILES={}, VIEWS=[], VIEWS_COUNT={}, VIEWS_RANGE='all';

function displayNameOf(uid, email){
  const pr = PROFILES[uid];
  if(pr && (pr.display_name || pr.username)) return pr.display_name || ('@'+pr.username);
  if(uid===USER?.id && localStorage.getItem('wd_name')) return localStorage.getItem('wd_name');
  return (email||'').split('@')[0] || 'مستخدم';
}
function avatarOf(uid,size){
  const pr=PROFILES[uid];
  if(pr && pr.avatar_url) return '<img class="'+(size==='mini'?'avatar-mini':'avatar')+'" src="'+esc(pr.avatar_url)+'">';
  const nm=displayNameOf(uid,''); const L=(nm[0]||'D').toUpperCase();
  if(size==='mini') return '<span class="avatar-mini-letter">'+L+'</span>';
  return L;
}
function usernameOf(uid){
  const pr = PROFILES[uid];
  if(pr && pr.username) return '@'+pr.username;
  return '';
}
async function loadProfiles(){
  try{ const {data} = await sb.from('profiles').select('*'); (data||[]).forEach(r=>{ PROFILES[r.user_id]=r; }); }catch(e){}
}
async function loadViews(){
  try{ const {data} = await sb.from('views').select('video_id,viewer_id,created_at'); VIEWS=data||[]; VIEWS_COUNT={}; VIEWS.forEach(r=>{ VIEWS_COUNT[r.video_id]=(VIEWS_COUNT[r.video_id]||0)+1; }); }catch(e){ VIEWS=[]; VIEWS_COUNT={}; }
}
function viewsInRange(range){
  const now = new Date();
  let from = null;
  if(range==='day') from = new Date(now.getTime()-24*3600*1000);
  if(range==='week') from = new Date(now.getTime()-7*24*3600*1000);
  if(range==='month') from = new Date(now.getTime()-30*24*3600*1000);
  if(range==='year') from = new Date(now.getTime()-365*24*3600*1000);
  return VIEWS.filter(r=>{ if(!from) return true; return new Date(r.created_at) >= from; });
}
function myViewsInRange(range){
  const mineIds = new Set((MY_VIDEO_IDS||[]));
  return viewsInRange(range).filter(r=>mineIds.has(r.video_id));
}
async function trackView(videoId){
  try{
    const key = 'wd_viewed_'+videoId+'_'+new Date().toISOString().slice(0,10);
    if(localStorage.getItem(key)) return;
    localStorage.setItem(key,'1');
    const {error} = await sb.from('views').insert([{video_id:videoId, viewer_id:USER.id}]);
    if(!error){ VIEWS_COUNT[videoId]=(VIEWS_COUNT[videoId]||0)+1; const el=document.getElementById('vc-'+videoId); if(el) el.textContent='👁️ '+(VIEWS_COUNT[videoId]||0); }
  }catch(e){}
}

function spawnDiamonds(n=12){ const fx=document.getElementById('fx'); if(!fx) return; for(let i=0;i<n;i++){ const s=document.createElement('img'); s.src='diamond-small.png?v=20'; s.className='fall-img'; s.style.left=Math.random()*100+'%'; const sz=18+Math.random()*22; s.style.width=sz+'px'; s.style.height=sz+'px'; s.style.animationDuration=(2.5+Math.random()*2)+'s'; fx.appendChild(s); setTimeout(()=>s.remove(),4500); } }
function toast(m){ if(!m.includes('خطأ')) spawnDiamonds(10);const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function v(id){return document.getElementById(id).value.trim()}
function setErr(m){const e=document.getElementById('err'); if(e) e.textContent=m}
function showLogin(msg=''){ nav.style.display='none'; app.innerHTML=`<div class="card"><input id="em" type="email" placeholder="إيميلك"><input id="pw" type="password" placeholder="كلمة السر"><input id="suName" placeholder="اسمك... مثلا عماد"><input id="suUser" placeholder="اليوزر... مثلا emmad"><button id="loginBtn" onclick="doLogin()">دخول</button><button class="ghost" onclick="doSignup()">إنشاء حساب جديد</button><button class="ghost" onclick="resend()">رسالة تأكيد</button><div class="err" id="err">${esc(msg)}</div></div>`; }
async function doSignup(){ const btn=document.getElementById('loginBtn'); try{ const email=v('em'),pw=v('pw'); if(!email) return setErr('اكتب إيميلك أولاً'); if(pw.length<6) return setErr('كلمة السر لازم 6 أحرف وفوق'); if(btn) btn.textContent='جاري إنشاء الحساب...'; const {data,error}=await sb.auth.signUp({email,password:pw}); if(error) throw error; try{ const nm=(document.getElementById('suName')?.value||'').trim(); const un=(document.getElementById('suUser')?.value||'').trim().replace('@','').toLowerCase(); if(data.user && (nm||un)) await sb.from('profiles').upsert([{user_id:data.user.id, display_name:nm||null, username:un||null}], {onConflict:'user_id'}); }catch(e){} toast('تم ✅ افتح إيميلك وأكد الحساب'); showLogin('تم ✅ روح لإيميلك وأكد الحساب، بعدها اضغط دخول'); }catch(e){ setErr(friendly(e)); } if(btn) btn.textContent='دخول'; }
function friendly(e){ const m=String(e&&e.message||e||''); if(m.includes('Email not confirmed')) return 'إيميلك بعد ما تأكد - افتح إيميلك واضغط رابط التأكيد، أو اضغط زر (رسالة تأكيد)'; if(m.includes('Invalid login')) return 'الإيميل أو كلمة السر غلط - تأكد منهن وحاول مرة ثانية'; if(m.includes('User already')) return 'هذا الإيميل مسجل أصلاً - اضغط دخول بدل إنشاء حساب'; if(m.includes('Failed to fetch')||m.includes('Network')) return 'النت ضعيف - شغل النت وحاول مرة ثانية'; if(m.includes('supabase')) return 'مشكلة اتصال بالسيرفر - حدث الصفحة وحاول'; return 'خطأ: '+m; }
async function doLogin(){ const btn=document.getElementById('loginBtn'); try{ if(!window.supabase||!sb) return setErr('الصفحة ما حملت كاملة - حدث الصفحة وحاول'); const email=v('em'),pw=v('pw'); if(!email) return setErr('اكتب إيميلك'); if(!pw) return setErr('اكتب كلمة السر'); if(btn){ btn.disabled=true; btn.textContent='جاري الدخول...'; } setErr('جاري الدخول...'); const {data,error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error; if(!data||!data.user) throw new Error('ما رجع حساب - حاول مرة ثانية'); setErr('تم الدخول ✅'); await afterLogin(); }catch(e){ setErr(friendly(e)); } if(btn){ btn.disabled=false; btn.textContent='دخول'; } }
async function resend(){ try{ const email=v('em'); if(!email) return setErr('اكتب إيميلك أولاً'); setErr('جاري إرسال رسالة التأكيد...'); const {error}=await sb.auth.resend({type:'signup',email}); if(error) throw error; setErr('تم 📩 افتح إيميلك واضغط رابط التأكيد'); toast('تم 📩'); }catch(e){ setErr(friendly(e)); } }
async function afterLogin(){ try{ const {data:{user}}=await sb.auth.getUser(); USER=user; if(!user) return showLogin('ما لگينا حساب - سجل دخول مرة ثانية'); try{ const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle(); IS_ADMIN=!!data; }catch(e){ IS_ADMIN=false; } try{ await loadCounts(); }catch(e){ COUNTS={pub:0,mine:0,pend:0}; } try{ await loadProfiles(); await loadViews(); await loadBlocks(); await loadSaved(); await loadNotifs(); }catch(e){} render(); }catch(e){ setErr(friendly(e)); } }
async function loadCounts(){ try{ const {data:pub}=await sb.from('videos').select('id').eq('is_published',true); const {data:mine}=await sb.from('videos').select('id').eq('owner_id',USER.id); MY_VIDEO_IDS=(mine||[]).map(x=>x.id); const {data:pend}=await sb.from('videos').select('id').eq('is_published',false); COUNTS={pub:pub?.length||0,mine:mine?.length||0,pend:pend?.length||0}; }catch(e){ COUNTS={pub:0,mine:0,pend:0}; } }
