<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD DIAMOND</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui;padding-bottom:90px}
.top{position:sticky;top:0;z-index:10;background:#000;text-align:center;padding:14px 10px 4px}
.diamond-scene{perspective:900px;display:flex;justify-content:center}
.diamond-3d{width:72px;height:72px;position:relative;transform-style:preserve-3d;animation:dspin 6s ease-in-out infinite,dfloat 3s ease-in-out infinite}
@keyframes dspin{0%,100%{transform:rotateY(-22deg) rotateX(6deg)}50%{transform:rotateY(22deg) rotateX(-4deg)}}
@keyframes dfloat{0%,100%{margin-top:0}50%{margin-top:-6px}}
.diamond-3d .top-facet{position:absolute;inset:0;clip-path:polygon(50% 0,100% 32%,50% 100%,0 32%);background:linear-gradient(135deg,#FFF8DC 0%,#FFD700 28%,#D4AF37 55%,#8B6508 78%,#FFEC8B 100%)}
.diamond-3d .facet-l{position:absolute;inset:0;clip-path:polygon(0 32%,50% 42%,50% 100%);background:linear-gradient(180deg,#B8860B,#6B4E00)}
.diamond-3d .facet-r{position:absolute;inset:0;clip-path:polygon(100% 32%,50% 42%,50% 100%);background:linear-gradient(180deg,#FFE55C,#A67C00)}
.diamond-3d .facet-m{position:absolute;inset:0;clip-path:polygon(50% 0,100% 32%,50% 42%,0 32%);background:linear-gradient(90deg,#FFFACD,#FFD700 40%,#FFF8DC 60%,#D4AF37)}
.diamond-3d .shine{position:absolute;left:18%;top:8%;width:22%;height:22%;background:radial-gradient(circle,#fff,transparent 70%);border-radius:50%}
.diamond-mini{width:28px;height:28px;display:inline-block;position:relative;filter:drop-shadow(0 3px 6px rgba(255,215,0,.6))}
.diamond-mini:before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 32%,50% 100%,0 32%);background:linear-gradient(135deg,#FFF8DC,#FFD700 40%,#B8860B)}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:linear-gradient(180deg,#131008,#0a0a0a);border:1px solid rgba(212,175,55,.45);border-radius:22px;padding:18px;margin-bottom:12px}
input,textarea{width:100%;background:#111;border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:14px;color:#fff;margin-bottom:10px;font-size:15px}
button{width:100%;background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000;border:none;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;margin-bottom:8px;font-size:15px}
button:disabled{opacity:.5}.ghost{background:#111!important;color:#D4AF37!important;border:1px solid rgba(212,175,55,.35)}
.small{font-size:12px;color:rgba(212,175,55,.85);text-align:center}.err{color:#ff8080;font-size:13px;text-align:center;min-height:18px}
.profile{text-align:center}.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;margin:0 auto;border:3px solid #FFD700}
.stats{display:flex;gap:8px;margin-top:14px}.stat{flex:1;background:#111;border:1px solid rgba(212,175,55,.25);border-radius:14px;padding:10px 4px;text-align:center}.stat b{color:#FFD700;font-size:18px;display:block}.stat span{font-size:11px;color:#D4AF37}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#111;border:1px solid rgba(212,175,55,.25);border-radius:16px;overflow:hidden}.tile video{width:100%;aspect-ratio:1/1;object-fit:cover;background:#000;display:block}.tile .p{padding:9px}.tile b{font-size:13px}.tile small{color:#D4AF37;font-size:11px}
.video{background:#111;border:1px solid rgba(212,175,55,.25);border-radius:18px;overflow:hidden;margin-bottom:14px}.video video{width:100%;display:block;background:#000;max-height:520px}.pad{padding:13px}.pad b{font-size:16px}.pad small{color:#D4AF37}
.badge{display:inline-block;font-size:11px;background:#222;border:1px solid rgba(212,175,55,.4);color:#FFD700;border-radius:999px;padding:4px 10px;margin-top:7px}
.row{display:flex;gap:8px}.row button{flex:1}.del{background:#221111!important;color:#ff8080!important;border:1px solid rgba(255,0,0,.3)}.approve{background:#0f2212!important;color:#7dff9a!important;border:1px solid rgba(0,255,0,.3)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid rgba(212,175,55,.35);display:flex;z-index:20;overflow-x:auto}
.nav button{flex:1;min-width:62px;background:none!important;color:#D4AF37;border:none;border-radius:0;padding:10px 2px;font-size:12px;margin:0}
.nav button.on{background:rgba(212,175,55,.15)!important;color:#FFD700}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #D4AF37;padding:10px 18px;border-radius:999px;font-size:13px;display:none;z-index:99}
.section{color:#FFD700;font-size:17px;font-weight:900;margin:8px 0 10px}
.like.on{background:linear-gradient(135deg,#D4AF37,#FFD700)!important;color:#000!important;box-shadow:0 0 18px rgba(255,215,0,.9);transform:scale(1.05)}
.diamond-btn{transition:.2s}
.diamond-btn:active{transform:scale(.9)}
.burst{position:relative}
.burst::after{content:"💎✨";position:absolute;left:50%;top:-6px;transform:translateX(-50%);animation:burst .8s ease forwards;pointer-events:none;font-size:18px}
@keyframes burst{0%{opacity:1;transform:translate(-50%,0) scale(.5)}100%{opacity:0;transform:translate(-50%,-28px) scale(1.4)}}
.comment{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.follow-btn.on{background:linear-gradient(135deg,#D4AF37,#FFD700)!important;color:#000!important}
.security-card{background:#0a0a0a;border:1px solid rgba(255,215,0,.3);border-radius:14px;padding:12px;margin-bottom:10px}
.pill{display:inline-block;background:#1a1605;border:1px solid rgba(255,215,0,.4);color:#FFD700;border-radius:999px;padding:4px 10px;font-size:12px;margin:2px}
.comment{background:#0a0a0a;border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px}
.comment b{color:#FFD700;font-size:12px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.fall{position:absolute;top:-30px;animation:fall linear forwards;opacity:.9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.video{position:relative}
.big-diamond{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;pointer-events:none;animation:pop .8s ease forwards;z-index:3;text-shadow:0 0 30px #FFD700}
@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1.6);opacity:0}}
.chip{flex:1;background:#111!important;color:#D4AF37!important;border:1px solid rgba(212,175,55,.35);border-radius:999px;padding:10px 4px!important;font-size:12px}
.chip.on{background:linear-gradient(135deg,#D4AF37,#FFD700)!important;color:#000!important}
.rank-gold{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000!important}
.rank-diamond{background:linear-gradient(135deg,#fff,#00E5FF);color:#000!important}
.skeleton{height:280px;background:linear-gradient(90deg,#111 25%,#222 50%,#111 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:18px;margin-bottom:14px}
@keyframes shimmer{to{background-position:-200% 0}}
.progress{height:8px;background:#222;border-radius:999px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#D4AF37,#FFD700);width:0%;transition:.3s}
.emoji-row{display:flex;gap:6px;margin-top:6px}
.emoji-row button{padding:8px!important;font-size:16px;background:#111!important}
.leader{border:1px solid rgba(255,215,0,.5);background:linear-gradient(180deg,#1a1400,#0a0a0a)}
.topbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0}

</style>
</head>
<body>
<div class="top"><div style="font-size:11px;color:#FFD700;letter-spacing:2px">WORLD DIAMOND • V5 💎✨</div><div class="diamond-scene"><div class="diamond-3d"><div class="top-facet"></div><div class="facet-l"></div><div class="facet-r"></div><div class="facet-m"></div><div class="shine"></div></div></div></div>
<div class="wrap" id="app">
<div class="card">
<input id="em" type="email" placeholder="إيميلك">
<input id="pw" type="password" placeholder="كلمة السر">
<button onclick="doLogin()">دخول</button>
<button class="ghost" onclick="doSignup()">إنشاء حساب جديد</button>
<button class="ghost" onclick="resend()">رسالة تأكيد</button>
<div class="err" id="err"></div></div>
</div>
<div id="fx"></div><div id="toast"></div>
<nav class="nav" id="nav" style="display:none">
<button id="n-feed" onclick="go('feed')"><span class="diamond-mini"></span></button>
<button id="n-upload" onclick="go('upload')">➕<br>ارفع</button>
<button id="n-you" onclick="go('you')">👤<br>YOU</button>
<button id="n-admin" onclick="go('admin')" style="display:none">👑<br>الأدمن</button><button id="n-users" onclick="go('users')">🔍<br>بحث يوزر</button><button id="n-settings" onclick="go('settings')">⚙️<br>الأمان</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://cwwvuwqmiaoyctfhjxez.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_JmbeY1li_JTtZ8P7fvik8Q_9IzihPCR";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const app=document.getElementById('app'), nav=document.getElementById('nav');
let USER=null, IS_ADMIN=false, TAB='feed', COUNTS={pub:0,mine:0,pend:0}, SEARCH='', LIKES={}, COMMENTS={}, FOLLOWS={}, MY_FOLLOWING=new Set(), USER_SEARCH='', SORT='new', MY_FOLLOWERS=0;
function spawnDiamonds(n=12){ const fx=document.getElementById('fx'); if(!fx) return; for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='fall'; s.textContent=['💎','✨','⭐'][i%3]; s.style.left=Math.random()*100+'%'; s.style.fontSize=(14+Math.random()*18)+'px'; s.style.animationDuration=(2.5+Math.random()*2)+'s'; fx.appendChild(s); setTimeout(()=>s.remove(),4500); } }
function toast(m){ if(m.includes('💎')) spawnDiamonds(10);const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function v(id){return document.getElementById(id).value.trim()}
function setErr(m){const e=document.getElementById('err'); if(e) e.textContent=m}
function showLogin(msg=''){ nav.style.display='none'; app.innerHTML=`<div class="card"><input id="em" type="email" placeholder="إيميلك"><input id="pw" type="password" placeholder="كلمة السر"><button onclick="doLogin()">دخول</button><button class="ghost" onclick="doSignup()">إنشاء حساب جديد</button><button class="ghost" onclick="resend()">رسالة تأكيد</button><div class="err" id="err">${esc(msg)}</div></div>`; }
async function doSignup(){ const email=v('em'),pw=v('pw'); if(!email||pw.length<6) return setErr(''); const {data,error}=await sb.auth.signUp({email,password:pw}); if(error) return setErr(error.message); toast('تم ✅'); showLogin('تم ✅'); }
async function doLogin(){ const email=v('em'),pw=v('pw'); if(!email||!pw) return setErr(''); const {data,error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) return setErr(error.message); await afterLogin(); }
async function resend(){ const email=v('em'); if(!email) return setErr(''); const {error}=await sb.auth.resend({type:'signup',email}); if(error) return setErr(error.message); toast('تم 📩'); }
async function afterLogin(){ const {data:{user}}=await sb.auth.getUser(); USER=user; if(!user) return showLogin(); const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle(); IS_ADMIN=!!data; await loadCounts(); render(); }
async function loadCounts(){ const {data:pub}=await sb.from('videos').select('id').eq('is_published',true); const {data:mine}=await sb.from('videos').select('id').eq('owner_id',USER.id); const {data:pend}=await sb.from('videos').select('id').eq('is_published',false); COUNTS={pub:pub?.length||0,mine:mine?.length||0,pend:pend?.length||0}; }
function go(t){TAB=t; render()}
function render(){
  nav.style.display='flex'; document.getElementById('n-admin').style.display=IS_ADMIN?'block':'none';
  ['feed','upload','you','admin','settings','users'].forEach(k=>{const b=document.getElementById('n-'+k); if(b) b.classList.toggle('on',TAB===k)});
  const letter=(USER.email[0]||'D').toUpperCase();
  app.innerHTML=`<div class="card profile"><div class="avatar">${letter}</div><h2>${esc(USER.email.split('@')[0])}</h2><small>${esc(USER.email.split('@')[0])} ${IS_ADMIN?'• 👑':''}</small>
  <div class="stats"><div class="stat"><b>${COUNTS.pub}</b><span>منشور</span></div><div class="stat"><b>${COUNTS.mine}</b><span>فيديوهاتي</span></div><div class="stat"><b>${COUNTS.pend}</b><span>بانتظار</span></div></div>
  <div class="stats"><div class="stat"><b id="myFollowers">-</b><span>💎 متابعيني</span></div><div class="stat"><b id="myFollowing">-</b><span>💎 أتابع</span></div><div class="stat"><b id="myDiamonds">-</b><span>💎 جواهري</span></div></div>
  <div class="row" style="margin-top:12px"><button class="ghost" onclick="logout()">خروج</button><button class="ghost" onclick="refresh()">🔄 تحديث</button></div></div><div id="content"></div>`;
  loadTab();
}
async function refresh(){await loadCounts(); render()}
async function logout(){await sb.auth.signOut(); USER=null; showLogin()}
async function loadTab(){
  const c=document.getElementById('content'); if(!c) return; c.innerHTML='<p class="small"></p>';
  if(TAB==='users'){ c.innerHTML=`<div class="card"><div class="section">🔍 بحث على يوزر - DIAMOND</div><input id="userSearch" placeholder="اكتب اسم اليوزر... مثلا emmad" value="${esc(USER_SEARCH)}" oninput="USER_SEARCH=this.value;renderUsers()"><div id="usersList"></div></div>`; renderUsers(); return; }
  if(TAB==='settings'){ c.innerHTML=`<div class="card"><div class="section">⚙️ إعدادات الأمان - DIAMOND</div>
  <div class="security-card"><b>🔒 حسابك</b><br><small>الإيميل مخفي للآخرين • يظهر لك فقط: ${esc(maskEmail(USER.email))}</small><br><span class="pill">✅ تأكيد الإيميل</span> <span class="pill">✅ جلسة آمنة</span> <span class="pill">🛡 حماية DIAMOND</span> <span class="pill">🔒 إيميل مخفي</span></div>
  <div class="security-card"><b>🔑 تغيير كلمة السر</b><br><input id="newPw" type="password" placeholder="كلمة سر جديدة - 6 أحرف وفوق"><button onclick="changePw()">تغيير كلمة السر</button></div>
  <div class="security-card"><b>👤 اسمك في التطبيق</b><br><small>هذا الاسم يظهر للآخرين بدل الإيميل</small><br><input id="displayName" placeholder="اكتب اسمك... مثلا عماد"><button class="ghost" onclick="saveName()">حفظ الاسم 💎</button></div>
  <div class="security-card"><b>🛡 مستوى الأمان</b><br><div class="progress"><i style="width:85%"></i></div><small>85% - قوي جداً - فعل تغيير كلمة السر كل فترة</small></div>
  <div class="security-card"><b>📩 رسالة تأكيد</b><br><button class="ghost" onclick="resend2()">إعادة إرسال رسالة التأكيد</button></div>
  <div class="security-card"><b>🚪 تسجيل الخروج من كل الأجهزة</b><br><button class="ghost" onclick="logout()">خروج</button></div>
  <div class="security-card"><b>🗑 حذف حسابي نهائياً</b><br><small>هذا يحذف حسابك من الجهاز فقط، تواصل مع الأدمن للحذف الكامل.</small><br><button class="del" onclick="if(confirm('متأكد تحذف حسابك؟')){logout()}">حذف الحساب</button></div></div>`; return; }
  if(TAB==='upload'){ c.innerHTML=`<div class="card"><div class="section">➕ ارفع فيديو</div><input id="title" placeholder="العنوان"><textarea id="desc" placeholder="الوصف" rows="2"></textarea><label style="font-size:12px;color:#D4AF37">فيديو</label><input id="file" type="file" accept="video/*"><label style="font-size:12px;color:#D4AF37">صورة غلاف</label><input id="cover" type="file" accept="image/*"><button id="upBtn" onclick="doUpload()">🚀 ارفع</button><div class="progress"><i id="upProg"></i></div><small id="upStat" class="small"></small><div class="err" id="upErr"></div></div>`; return; }
  if(TAB==='feed'){ c.innerHTML=`<div class="topbar"><button class="chip ${SORT==='new'?'on':''}" onclick="SORT='new';loadTab()">🆕 الأحدث</button><button class="chip ${SORT==='top'?'on':''}" onclick="SORT='top';loadTab()">🔥 الأكثر جوهرة</button><button class="chip ${SORT==='leader'?'on':''}" onclick="SORT='leader';loadTab()">👑 المتصدرين</button></div><div id="feedList"><div class="skeleton"></div></div>`; }
  let q;
  if(TAB==='you') q=sb.from('videos').select('*').eq('owner_id',USER.id).order('created_at',{ascending:false});
  else if(TAB==='admin') q=sb.from('videos').select('*').order('created_at',{ascending:false});
  else q=sb.from('videos').select('*').eq('is_published',true).order('created_at',{ascending:false});
  const {data,error}=await q;
  if(error) return c.innerHTML='<p class="err">'+esc(error.message)+'</p>';
  let list=data||[];
  if(TAB==='feed' && SORT==='top'){ await loadLikes(list); list=[...list].sort((a,b)=>(likeInfo(b.id).count||0)-(likeInfo(a.id).count||0)); }
  if(TAB==='feed' && SORT==='leader'){ const leaders=[...list].sort((a,b)=>(likeInfo(b.id).count||0)-(likeInfo(a.id).count||0)).slice(0,3); const fl=document.getElementById('feedList'); if(fl) fl.innerHTML=`<div class="card leader"><div class="section">👑 متصدري الجواهر</div>`+leaders.map((v,i)=>`<div class="comment"><b>${i===0?'🥇':i===1?'🥈':'🥉'} ${esc((v.owner_email||'').split('@')[0])}</b> - ${esc(v.title)} - 💎 ${likeInfo(v.id).count}</div>`).join('')+`</div>`; }

  if(TAB==='feed' && SEARCH){ list=list.filter(x=>(x.title||'').includes(SEARCH)||(x.description||'').includes(SEARCH)||(x.owner_email||'').includes(SEARCH)); }
  await loadLikes(list); await loadFollows(list);
  const title=TAB==='feed'?'':TAB==='you'?'':'👑';
  if(TAB==='you'&&list.length) c.innerHTML=`<div class="section">${title} (${list.length})</div><div class="grid">${list.map(t=>tile(t)).join('')}</div>`;
  else if(TAB==='feed'){ const fl=document.getElementById('feedList'); if(fl) fl.innerHTML=`<input id="search" placeholder="🔍 بحث" value="${esc(SEARCH)}" oninput="SEARCH=this.value;loadTab()">`+(list.length?list.map(card).join(''):`<p class="small">لا يوجد فيديو بعد</p>`); }
  else c.innerHTML=`${TAB==='feed'?`<input id="search" placeholder="🔍 بحث" value="${esc(SEARCH)}" oninput="SEARCH=this.value;loadTab()">`:''} placeholder="🔍 بحث" value="${esc(SEARCH)}" oninput="SEARCH=this.value;loadTab()">`:''}<div class="section">${title} (${list.length})</div>`+(list.length?list.map(card).join(''):`<p class="small">${TAB==='you'?'لا يوجد':''}</p>`);
}
async function renderUsers(){ const box=document.getElementById('usersList'); if(!box) return; try{ const {data}=await sb.from('videos').select('owner_id,owner_email'); const map={}; (data||[]).forEach(v=>{ if(!v.owner_id) return; if(!map[v.owner_id]) map[v.owner_id]={email:v.owner_email||'',count:0}; map[v.owner_id].count++; }); let users=Object.entries(map).map(([id,u])=>({id,...u})); const q=(USER_SEARCH||'').trim().toLowerCase(); if(q) users=users.filter(u=>(u.email||'').toLowerCase().includes(q)); await loadFollows([]); if(!users.length){ box.innerHTML='<p class="small">ما لگينا يوزر بهذا الاسم 💎</p>'; return; } box.innerHTML=users.map(u=>`<div class="comment" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>💎 ${esc((u.email||'').split('@')[0])}</b><br><small>${u.count} فيديو • ${FOLLOWS[u.id]||0} متابع</small></div>${u.id===USER.id?'':`<button class="ghost follow-btn ${MY_FOLLOWING.has(u.id)?'on':''}" style="width:auto;padding:10px 14px" onclick="toggleFollow('${u.id}',this)">${MY_FOLLOWING.has(u.id)?'💎 تتابع':'💎 متابعة'}</button>`}</div>`).join(''); }catch(e){ box.innerHTML='<p class="err">'+esc(e.message)+'</p>'; } }
async function loadFollows(list){ try{ const {data}=await sb.from('follows').select('follower_id,following_id'); const all=data||[]; MY_FOLLOWING=new Set(all.filter(r=>r.follower_id===USER.id).map(r=>r.following_id)); FOLLOWS={}; all.forEach(r=>{ FOLLOWS[r.following_id]=(FOLLOWS[r.following_id]||0)+1; }); const mf=document.getElementById('myFollowers'); if(mf) mf.textContent=all.filter(r=>r.following_id===USER.id).length; const mg=document.getElementById('myFollowing'); if(mg) mg.textContent=MY_FOLLOWING.size; const md=document.getElementById('myDiamonds'); if(md){ const {data:lk}=await sb.from('likes').select('video_id').in('video_id',list.map(x=>x.id)); md.textContent=(lk||[]).length; } }catch(e){} }
async function toggleFollow(ownerId,btn){ if(!ownerId||ownerId===USER.id) return; try{ if(MY_FOLLOWING.has(ownerId)){ const {error}=await sb.from('follows').delete().eq('follower_id',USER.id).eq('following_id',ownerId); if(error) throw error; MY_FOLLOWING.delete(ownerId); toast('تم إلغاء المتابعة'); } else { const {error}=await sb.from('follows').insert([{follower_id:USER.id,following_id:ownerId}]); if(error) throw error; MY_FOLLOWING.add(ownerId); toast('💎 تابعت DIAMOND'); if(btn) btn.classList.add('burst'); } await loadFollows([]); render(); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 03 بالـ SQL'); } }
function maskEmail(e){ if(!e) return ''; const [a,b]=e.split('@'); return a.slice(0,2)+'***@'+(b||''); }
async function saveName(){ const n=document.getElementById('displayName').value.trim(); if(!n) return toast('اكتب اسمك'); localStorage.setItem('wd_name',n); toast('💎 تم حفظ اسمك: '+n); }
async function changePw(){ const pw=document.getElementById('newPw').value.trim(); if(pw.length<6) return toast('كلمة السر 6 أحرف وفوق'); const {error}=await sb.auth.updateUser({password:pw}); if(error) return toast('خطأ: '+error.message); toast('✅ تم تغيير كلمة السر'); }
async function resend2(){ const {error}=await sb.auth.resend({type:'signup',email:USER.email}); if(error) return toast(error.message); toast('تم 📩'); }
async function loadLikes(list){ LIKES={}; try{ const ids=list.map(x=>x.id); if(!ids.length) return; const {data}=await sb.from('likes').select('video_id,user_id').in('video_id',ids); (data||[]).forEach(r=>{ LIKES[r.video_id]=LIKES[r.video_id]||{count:0,mine:false}; LIKES[r.video_id].count++; if(r.user_id===USER.id) LIKES[r.video_id].mine=true; }); }catch(e){} }
function rankFor(n){ if(n>=50) return ['👑 ملك DIAMOND','rank-diamond']; if(n>=20) return ['💎 ذهبي','rank-gold']; if(n>=5) return ['⭐ فضي','']; return ['✨ جديد','']; }
async function doubleDiamond(id,el){ const d=document.createElement('div'); d.className='big-diamond'; d.textContent='💎'; el.appendChild(d); setTimeout(()=>d.remove(),800); const info=likeInfo(id); if(!info.mine) await toggleLike(id,null); spawnDiamonds(14); }
function reactComment(btn){ const em=btn.textContent; const box=btn.closest('.comment'); if(!box) return; let s=box.querySelector('.reacts'); if(!s){ s=document.createElement('div'); s.className='reacts small'; box.appendChild(s); } s.textContent=(s.textContent||'')+' '+em; spawnDiamonds(3); }
function likeInfo(id){ return LIKES[id]||{count:0,mine:false}; }
async function toggleLike(id,btn){ try{ const info=likeInfo(id); if(info.mine){ const {error}=await sb.from('likes').delete().eq('video_id',id).eq('user_id',USER.id); if(error) throw error; } else { const {error}=await sb.from('likes').insert([{video_id:id,user_id:USER.id}]); if(error) throw error; if(btn){ btn.classList.add('burst'); setTimeout(()=>btn.classList.remove('burst'),800); } toast('💎 جوهرة ذهبية!'); } await loadCounts(); render(); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 03 بالـ SQL'); } }
async function loadComments(id){ try{ const {data}=await sb.from('comments').select('*').eq('video_id',id).order('created_at',{ascending:true}); COMMENTS[id]=data||[]; const box=document.getElementById('cm-'+id); if(box) box.innerHTML=COMMENTS[id].length?COMMENTS[id].map(c=>`<div class="comment"><b>💎 ${esc((c.user_email||'').split('@')[0])}</b><br>${esc(c.text)}<div class="emoji-row"><button onclick="reactComment(this)">💎</button><button onclick="reactComment(this)">🔥</button><button onclick="reactComment(this)">👏</button><button onclick="reactComment(this)">😍</button><button onclick="reactComment(this)">😂</button></div></div>`).join(''):'<p class="small">لا يوجد تعليقات بعد - كن أول واحد 💎</p>'; }catch(e){} }
async function sendComment(id){ const inp=document.getElementById('ci-'+id); const text=inp.value.trim(); if(!text) return toast('اكتب تعليق أولاً'); const btn=document.getElementById('cb-'+id); if(btn) btn.disabled=true; try{ const {error}=await sb.from('comments').insert([{video_id:id,user_id:USER.id,user_email:USER.email,text}]); if(error) throw error; inp.value=''; toast('💎 تم إرسال تعليقك'); await loadComments(id); }catch(e){ toast('خطأ: '+e.message+' - نفذ ملف 03 بالـ SQL'); } if(btn) btn.disabled=false; }
function shareVideo(url){ if(navigator.share){ navigator.share({url}).catch(()=>{}); } else { navigator.clipboard.writeText(url); toast('تم النسخ'); } }
function tile(v){ return `<div class="tile"><video src="${esc(v.video_url)}" preload="metadata" poster="${esc(v.image_url||'')}"></video><div class="p"><b>${esc(v.title)}</b><br><small>${v.is_published?'✅ منشور':'⏳ بانتظار'}</small></div></div>`; }
function card(v){ const isMine=v.owner_id===USER.id; const lk=likeInfo(v.id); return `<div class="video" ondblclick="doubleDiamond(${v.id},this)"><video src="${esc(v.video_url)}" controls preload="metadata" poster="${esc(v.image_url||'')}"></video><div class="pad"><b>${esc(v.title)}</b><br><small>${esc((v.owner_email||'').split('@')[0])} • ${new Date(v.created_at).toLocaleDateString('ar')}</small><br><span class="badge">${v.is_published?'✅ منشور':'⏳'}</span> <span class="badge ${rankFor(lk.count)[1]}">${rankFor(lk.count)[0]}</span><p style="font-size:13px;color:#ccc">${esc(v.description||'')}</p>
<div class="row"><button class="ghost follow-btn ${MY_FOLLOWING.has(v.owner_id)?'on':''}" onclick="toggleFollow('${v.owner_id}',this)" ${v.owner_id===USER.id?'style="display:none"':''}>${MY_FOLLOWING.has(v.owner_id)?'💎 تتابع DIAMOND':'💎 متابعة DIAMOND'} (${FOLLOWS[v.owner_id]||0})</button></div>
<div class="row"><button class="ghost like diamond-btn ${lk.mine?'on':''}" onclick="toggleLike(${v.id},this)">💎 ${lk.count}</button><button class="ghost" onclick="loadComments(${v.id})">💬 تعليقات</button><button class="ghost" onclick="shareVideo('${esc(v.video_url)}')">↗ مشاركة</button></div>
<div id="cm-${v.id}"></div><div class="row" style="margin-top:8px"><input id="ci-${v.id}" placeholder="✨ اكتب تعليق جميل..."><button id="cb-${v.id}" onclick="sendComment(${v.id})">💎 إرسال</button></div>
<div class="row" style="margin-top:8px">${IS_ADMIN&&!v.is_published?`<button class="approve" onclick="approve(${v.id})">✅ موافقة</button>`:''}${IS_ADMIN&&v.is_published?`<button class="ghost" onclick="unpublish(${v.id})">إخفاء</button>`:''}${(IS_ADMIN||isMine)?`<button class="del" onclick="delVideo(${v.id})">🗑 حذف</button>`:''}</div></div></div>`; }
async function approve(id){const {error}=await sb.from('videos').update({is_published:true}).eq('id',id); if(error) return toast(error.message); toast('تم ✅'); await loadCounts(); render()}
async function unpublish(id){const {error}=await sb.from('videos').update({is_published:false}).eq('id',id); if(error) return toast(error.message); toast('تم ✅'); await loadCounts(); render()}
async function delVideo(id){if(!confirm('حذف؟'))return; const {error}=await sb.from('videos').delete().eq('id',id); if(error) return toast(error.message); toast('تم ✅'); await loadCounts(); render()}
async function doUpload(){ const btn=document.getElementById('upBtn'), err=document.getElementById('upErr'); const title=document.getElementById('title').value.trim(), desc=document.getElementById('desc').value.trim(); const file=document.getElementById('file').files[0], cover=document.getElementById('cover').files[0]; if(!title||!file){err.textContent='';return} btn.disabled=true; btn.textContent='جاري الرفع... 💎'; const pr=document.getElementById('upProg'); if(pr) pr.style.width='30%'; const st=document.getElementById('upStat'); if(st) st.textContent='جاري رفع الفيديو... لا تسكر الصفحة'; try{ const fname=USER.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'); const {error:upErr}=await sb.storage.from('videos').upload(fname,file,{upsert:true}); if(upErr) throw upErr; const {data:pub}=sb.storage.from('videos').getPublicUrl(fname); let image_url=''; if(cover){ const cf=USER.id+'/'+Date.now()+'-cover-'+cover.name.replace(/[^a-zA-Z0-9._-]/g,'_'); const {error:cerr}=await sb.storage.from('covers').upload(cf,cover,{upsert:true}); if(!cerr) image_url=sb.storage.from('covers').getPublicUrl(cf).data.publicUrl; } const {error:insErr}=await sb.from('videos').insert([{title,description:desc,video_url:pub.publicUrl,image_url,owner_id:USER.id,owner_email:USER.email,is_published:IS_ADMIN}]); if(insErr) throw insErr; toast('تم ✅'); TAB='you'; await loadCounts(); render(); }catch(e){ err.textContent=''+e.message; btn.disabled=false; btn.textContent='🚀 ارفع'; } }
if(window.supabase) sb.auth.getSession().then(({data})=>{ if(data.session) afterLogin(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
